<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตะกร้า — จองชุดเฟรชชี่</title>
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" data-od-id="cart-phone">
      <header class="topbar" data-od-id="cart-topbar">
        <a class="back" href="home.html" aria-label="กลับ"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <h1 data-od-id="cart-title">ตะกร้า</h1>
      </header>

      <div class="app-body has-sticky-cta" data-od-id="cart-body">
        <div id="cart-empty" class="empty" hidden data-od-id="cart-empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5h2l1.4 9.2a1.5 1.5 0 0 0 1.5 1.3h8.4a1.5 1.5 0 0 0 1.5-1.2L20 8H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19" r="1.3" fill="currentColor"/><circle cx="17" cy="19" r="1.3" fill="currentColor"/></svg>
          </div>
          <p class="kicker">ยังไม่มีรายการ</p>
          <h2>ตะกร้าว่าง</h2>
          <p class="caption">เลือกชุดเฟรชชี่จากหน้าหลักเพื่อเริ่มจอง</p>
          <p class="mt-16"><a class="btn btn-secondary" href="home.html" data-od-id="cart-go-shop">ไปเลือกสินค้า</a></p>
        </div>

        <div id="cart-list" class="list" data-od-id="cart-list"></div>

        <div id="cart-summary" class="summary-card" hidden data-od-id="cart-summary">
          <div class="summary-row"><span>ราคาสินค้า</span><span>รอประกาศราคา</span></div>
          <div class="summary-row"><span>ค่าจัดส่ง</span><span class="muted">คำนวณตอนชำระ (ถ้าส่งไปรษณีย์)</span></div>
          <div class="summary-row total"><span>ยอดรวมโดยประมาณ</span><span>รอประกาศราคา</span></div>
        </div>
      </div>

      <div class="sticky-cta" id="cart-cta" hidden data-od-id="cart-sticky">
        <a class="btn btn-primary btn-lg btn-block" href="checkout.html" data-od-id="cart-checkout-cta">ดำเนินการจอง</a>
      </div>

      <nav class="tabbar" aria-label="เมนูหลัก">
        <a class="tab" href="home.html"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>หน้าหลัก</a>
        <a class="tab" href="order-status.html"><svg viewBox="0 0 24 24"><path d="M7 8V7a5 5 0 0 1 10 0v1M5.5 8h13l-.8 11.2A2 2 0 0 1 15.7 21H8.3a2 2 0 0 1-2-1.8L5.5 8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>คำสั่งซื้อ</a>
        <a class="tab" href="pickup-assist.html"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>รับสินค้า</a>
        <a class="tab" href="../index.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>ภาพรวม</a>
      </nav>
    </div>
  </div>
  <script src="../assets/app.js"></script>
  <script>
    (function () {
      var cart = FreshyApp.getCart();
      var list = document.getElementById("cart-list");
      var empty = document.getElementById("cart-empty");
      var summary = document.getElementById("cart-summary");
      var cta = document.getElementById("cart-cta");

      if (!cart.length) {
        empty.hidden = false;
        return;
      }

      summary.hidden = false;
      cta.hidden = false;
      list.innerHTML = cart
        .map(function (item) {
          var specs = (item.specs || [])
            .map(function (s) {
              return "<li>" + s + "</li>";
            })
            .join("");
          return (
            '<article class="line-item" data-od-id="cart-item-' +
            item.id +
            '">' +
            '<img src="' +
            item.image +
            '" alt="" />' +
            "<div>" +
            "<h3>" +
            item.name +
            "</h3>" +
            '<ul class="line-specs">' +
            specs +
            "</ul>" +
            '<p class="caption mt-10">' +
            item.priceLabel +
            "</p>" +
            '<button type="button" class="btn btn-ghost" data-remove="' +
            item.id +
            '">ลบรายการ</button>' +
            "</div></article>"
          );
        })
        .join("");

      list.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-remove]");
        if (!btn) return;
        FreshyApp.removeFromCart(btn.getAttribute("data-remove"));
        location.reload();
      });
    })();
  </script>
</body>
</html>
