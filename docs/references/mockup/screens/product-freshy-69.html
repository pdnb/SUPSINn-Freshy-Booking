<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ชุดเฟรชชี่ ปี 69</title>
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" data-od-id="freshy69-phone">
      <header class="topbar" data-od-id="freshy69-topbar">
        <a class="back" href="home.html" aria-label="กลับ" data-od-id="freshy69-back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <h1>รายละเอียดสินค้า</h1>
        <a class="icon-btn icon-btn--on-light" href="cart.html" aria-label="ตะกร้า" data-od-id="freshy69-cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h2l1.4 9.2a1.5 1.5 0 0 0 1.5 1.3h8.4a1.5 1.5 0 0 0 1.5-1.2L20 8H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19" r="1.3" fill="currentColor"/><circle cx="17" cy="19" r="1.3" fill="currentColor"/></svg>
          <span class="badge" data-cart-badge hidden>0</span>
        </a>
      </header>

      <div class="app-body has-sticky-cta" data-od-id="freshy69-body">
        <div class="hero-media" data-od-id="freshy69-media">
          <img src="../assets/freshy-69.png" alt="ชุดเฟรชชี่ ปี 69" />
        </div>

        <section class="detail-panel" data-od-id="freshy69-detail">
          <span class="chip warn">ซื้อแยกได้</span>
          <h2>ชุดเฟรชชี่ ปี 69</h2>
          <div class="price-row">
            <span class="price-lg">รอประกาศราคา</span>
            <span class="caption">เสื้อ + กางเกง</span>
          </div>
          <p class="caption mt-10">
            สำหรับผู้ที่ต้องการเฉพาะชุดเฟรชชี่ปี 69 สามารถเลือกไซส์เสื้อและกางเกงแยกกันได้
          </p>
        </section>

        <section class="config-block" data-od-id="config-69-top">
          <div class="config-head">
            <h3>เสื้อเฟรชชี่</h3>
            <span class="req">จำเป็น</span>
          </div>
          <span class="field-label" id="label-69-top">ไซส์เสื้อ</span>
          <div class="size-grid" data-size-group="top" data-od-id="size-69-top" role="group" aria-labelledby="label-69-top"></div>
        </section>

        <section class="config-block" data-od-id="config-69-bottom">
          <div class="config-head">
            <h3>กางเกงเฟรชชี่</h3>
            <span class="req">จำเป็น</span>
          </div>
          <span class="field-label" id="label-69-bottom">ไซส์กางเกง</span>
          <div class="size-grid" data-size-group="bottom" data-od-id="size-69-bottom" role="group" aria-labelledby="label-69-bottom"></div>
        </section>
      </div>

      <div class="sticky-cta" data-od-id="freshy69-sticky">
        <div class="left">
          <div class="caption">ราคา</div>
          <div class="price-lg sticky-price">รอประกาศราคา</div>
        </div>
        <button type="button" class="btn btn-primary btn-lg" id="add-69" data-od-id="freshy69-add-cta">เพิ่มตะกร้า</button>
      </div>

      <nav class="tabbar" aria-label="เมนูหลัก">
        <a class="tab" href="home.html"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>หน้าหลัก</a>
        <a class="tab" href="order-status.html"><svg viewBox="0 0 24 24"><path d="M7 8V7a5 5 0 0 1 10 0v1M5.5 8h13l-.8 11.2A2 2 0 0 1 15.7 21H8.3a2 2 0 0 1-2-1.8L5.5 8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>คำสั่งซื้อ</a>
        <a class="tab" href="pickup-assist.html"><svg viewBox="0 0 24 24"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>รับสินค้า</a>
        <a class="tab" href="../index.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>ภาพรวม</a>
      </nav>
    </div>
  </div>
  <script src="../assets/app.js"></script>
  <script>
    (function () {
      var sizes = ["S", "M", "L", "XL", "2XL"];
      var state = {};

      document.querySelectorAll("[data-size-group]").forEach(function (el) {
        var key = el.getAttribute("data-size-group");
        el.innerHTML = sizes
          .map(function (s) {
            return '<button type="button" class="size-btn" data-size="' + s + '" aria-pressed="false">' + s + "</button>";
          })
          .join("");
        el.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-size]");
          if (!btn) return;
          el.querySelectorAll(".size-btn").forEach(function (b) {
            b.setAttribute("aria-pressed", "false");
          });
          btn.setAttribute("aria-pressed", "true");
          state[key] = btn.getAttribute("data-size");
          el.classList.remove("is-invalid");
        });
      });

      document.getElementById("add-69").addEventListener("click", function () {
        document.querySelectorAll("[data-size-group]").forEach(function (el) {
          var key = el.getAttribute("data-size-group");
          el.classList.toggle("is-invalid", !state[key]);
        });
        if (!state.top || !state.bottom) {
          FreshyApp.toast("กรุณาเลือกไซส์เสื้อและกางเกง");
          var first = document.querySelector("[data-size-group].is-invalid .size-btn");
          if (first) first.focus();
          return;
        }
        FreshyApp.addToCart({
          id: "freshy-69",
          name: "ชุดเฟรชชี่ ปี 69",
          image: "../assets/freshy-69.png",
          qty: 1,
          priceLabel: FreshyApp.moneyLabel(),
          specs: ["เสื้อไซส์ " + state.top, "กางเกงไซส์ " + state.bottom],
        });
        setTimeout(function () {
          location.href = "cart.html";
        }, 500);
      });
    })();
  </script>
</body>
</html>
