<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ภาพรวม — แอดมิน มรส. ชุดเฟรชชี่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/shell.css" />
</head>
<body>
  <div class="app" data-od-id="shell">
    <aside class="sidebar" data-chrome="sidebar" data-od-id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" data-chrome="topbar" data-od-id="topbar"></header>
      <main class="canvas" id="admin-main" data-od-id="canvas">
        <div class="page-head">
          <div>
            <h1 class="page-title">ภาพรวม</h1>
            <p class="page-sub">งานวันเปิดจอง — คิวสลิปและจัดส่งน้ำหนักเท่ากัน <span class="sample-tag">[ตัวอย่าง]</span></p>
          </div>
          <a class="btn btn-primary" href="admin-orders.html" data-od-id="cta-enter-queue">เข้าคิวสลิป</a>
        </div>

        <section class="kpis" data-od-id="kpi-strip" aria-label="ตัวชี้วัดตัวอย่าง">
          <article class="kpi">
            <div class="kpi-label">คิวรอตรวจ <span class="sample-tag">[ตัวอย่าง]</span></div>
            <div class="kpi-value" id="kpi-pending">0</div>
          </article>
          <article class="kpi">
            <div class="kpi-label">รอจัดส่ง / ยืนยันแล้ว <span class="sample-tag">[ตัวอย่าง]</span></div>
            <div class="kpi-value" id="kpi-fulfill">0</div>
          </article>
          <article class="kpi">
            <div class="kpi-label">พร้อมรับ <span class="sample-tag">[ตัวอย่าง]</span></div>
            <div class="kpi-value" id="kpi-ready">0</div>
          </article>
        </section>

        <div class="split">
          <section class="panel" data-od-id="attention-queue">
            <div class="panel-head">รายการค้าง</div>
            <div id="attention-list"></div>
          </section>
          <section class="panel" data-od-id="recent-orders">
            <div class="panel-head">ออเดอร์ล่าสุด</div>
            <div id="recent-list"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="admin-data.js"></script>
  <script src="assets/chrome.js"></script>
  <script>
    AdminChrome.mount({ active: "overview" });
    const state = AdminChrome.state();
    const pending = state.orders.filter((order) => order.status === "pending_review");
    const fulfill = state.orders.filter((order) => order.status === "confirmed");
    const ready = state.orders.filter((order) => order.status === "ready_for_pickup");

    document.getElementById("kpi-pending").textContent = pending.length;
    document.getElementById("kpi-fulfill").textContent = fulfill.length;
    document.getElementById("kpi-ready").textContent = ready.length;

    const attention = [...pending, ...state.orders.filter((order) => order.status === "need_reslip")];
    document.getElementById("attention-list").innerHTML = attention.map((order) => `
      <a class="attn-row" href="admin-order-detail.html?id=${order.id}" data-od-id="attn-${order.id}">
        <span><span class="mono">${order.id}</span> · ${order.name}</span>
        ${AdminChrome.pill(order.status)}
      </a>
    `).join("") || `<p class="empty">ไม่มีรายการค้าง</p>`;

    document.getElementById("recent-list").innerHTML = state.orders.slice(0, 6).map((order) => {
      let href = `admin-order-detail.html?id=${order.id}`;
      if (order.fulfillment === "post" && (order.status === "confirmed" || order.status === "shipped")) {
        href = `admin-fulfillment.html?id=${order.id}`;
      } else if (order.fulfillment !== "post" && order.status === "ready_for_pickup") {
        href = `admin-pickup.html?search=${order.id}`;
      }

      return `
        <a class="attn-row" href="${href}" data-od-id="recent-${order.id}">
          <span><span class="mono">${order.id}</span> · ${AdminChrome.channel(order.fulfillment)}</span>
          ${AdminChrome.pill(order.status)}
        </a>
      `;
    }).join("");
  </script>
</body>
</html>
