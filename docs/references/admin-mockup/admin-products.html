<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สินค้า — แอดมิน มรส. ชุดเฟรชชี่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/shell.css" />
</head>
<body>
  <div class="app" data-od-id="shell">
    <aside class="sidebar" data-chrome="sidebar" data-od-id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" data-chrome="topbar" data-od-id="topbar"></header>
      <main class="canvas" id="admin-main" data-od-id="canvas">
        <div class="page-head">
          <div>
            <h1 class="page-title">สินค้า</h1>
            <p class="page-sub">แคตตาล็อกคอมโบปี 70 และชิ้นปี 69 — ไม่มี SKU หรือสต็อกขาย</p>
          </div>
          <a class="btn btn-primary" href="admin-product-edit.html" data-od-id="cta-add-product">เพิ่มสินค้า</a>
        </div>

        <div class="filters" data-od-id="product-filters">
          <input class="input" id="filter-search" type="search" placeholder="ชื่อสินค้า" aria-label="ค้นหา" data-od-id="product-search" />
          <select class="select" id="filter-status" aria-label="สถานะ" data-od-id="product-status">
            <option value="all">ทั้งหมด</option>
            <option value="active">เผยแพร่</option>
            <option value="draft">ฉบับร่าง</option>
          </select>
          <p class="page-sub" style="align-self:end">คัดลอกจากรอบ: ใช้วิซาร์ด clone ในแอปจริง ที่ <span class="mono">/admin/products/clone-from-round</span></p>
        </div>

        <section class="panel">
          <div class="ds-table-wrap">
            <table class="ds-table" data-od-id="products-table">
              <thead>
                <tr>
                  <th><input type="checkbox" aria-label="เลือกทั้งหมด" data-od-id="product-select-all" /></th>
                  <th>รูป</th>
                  <th>ชื่อ</th>
                  <th>ชนิด</th>
                  <th>ราคา</th>
                  <th>สถานะ</th>
                </tr>
              </thead>
              <tbody id="products-body"></tbody>
            </table>
          </div>
          <p class="empty" id="products-empty" hidden>ไม่พบสินค้าจากคำค้นนี้</p>
        </section>
      </main>
    </div>
  </div>
  <script src="admin-data.js"></script>
  <script src="assets/chrome.js"></script>
  <script>
    AdminChrome.mount({ active: "products" });
    const state = AdminChrome.state();

    function render() {
      const q = document.getElementById("filter-search").value.trim();
      const status = document.getElementById("filter-status").value;
      const rows = state.products.filter((product) => {
        const matchQ = q === "" || product.name.includes(q);
        const matchStatus = status === "all" || (status === "active" ? product.active : !product.active);

        return matchQ && matchStatus;
      });

      document.getElementById("products-empty").hidden = rows.length > 0;
      document.getElementById("products-body").innerHTML = rows.map((product) => `
        <tr>
          <td><input type="checkbox" aria-label="เลือก ${product.name}" /></td>
          <td><div class="media-slot" style="min-height:44px;width:44px">รูป</div></td>
          <td><a href="admin-product-edit.html?id=${product.id}" data-od-id="product-link-${product.id}">${product.name}</a></td>
          <td>${product.type === "bundle" ? "ชุดคอมโบ" : "ชิ้นเดียว"}</td>
          <td class="mono">${AdminChrome.money(product.price)}</td>
          <td><span class="pill ${product.active ? "pill-active" : "pill-draft"}">${product.active ? "เผยแพร่" : "ฉบับร่าง"}</span></td>
        </tr>
      `).join("");
    }

    document.getElementById("filter-search").addEventListener("input", render);
    document.getElementById("filter-status").addEventListener("change", render);
    render();
  </script>
</body>
</html>
