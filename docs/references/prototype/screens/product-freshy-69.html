<!DOCTYPE html>

<body class="m-0 min-h-dvh bg-bg font-sans text-[15px] leading-relaxed text-fg antialiased">

      <header class="sticky top-0 z-20 flex h-14 items-center gap-2 border-b border-border bg-surface px-2" data-od-id="freshy69-topbar">

          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <h1 class="flex-1 text-center text-base font-semibold">รายละเอียดสินค้า</h1>
        <a class="relative inline-flex h-11 w-11 items-center justify-center rounded-full text-fg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" href="cart.html" aria-label="ตะกร้า" data-od-id="freshy69-cart">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h2l1.4 9.2a1.5 1.5 0 0 0 1.5 1.3h8.4a1.5 1.5 0 0 0 1.5-1.2L20 8H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="19" r="1.3" fill="currentColor"/><circle cx="17" cy="19" r="1.3" fill="currentColor"/></svg>
          <span class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-accent px-1 text-[10px] font-semibold text-accent-fg">2</span>
        </a>
      </header>

      <div class="flex-1 overflow-y-auto pb-[calc(58px+env(safe-area-inset-bottom,0px)+84px)]" data-od-id="freshy69-body">
        <div class="relative aspect-[4/3] overflow-hidden bg-border/30 md:aspect-[21/9]" data-carousel data-od-id="freshy69-media" aria-roledescription="carousel" aria-label="รูปสินค้า">
          <div class="flex h-full w-full transition-transform duration-300 ease-out" data-carousel-track>
            <div class="h-full w-full shrink-0" role="group" aria-label="1 จาก 3">
              <img src="../assets/freshy-69.png" alt="ชุดเฟรชชี่ ปี 69 — มุมเต็มชุด" class="h-full w-full object-cover object-center" />
            </div>
            <div class="h-full w-full shrink-0" role="group" aria-label="2 จาก 3">
              <img src="../assets/freshy-69.png" alt="ชุดเฟรชชี่ ปี 69 — รายละเอียดเสื้อ" class="h-full w-full object-cover object-top" />
            </div>
            <div class="h-full w-full shrink-0" role="group" aria-label="3 จาก 3">
              <img src="../assets/freshy-69.png" alt="ชุดเฟรชชี่ ปี 69 — มุมใกล้" class="h-full w-full scale-110 object-cover object-[center_70%]" />
            </div>
          </div>
          <div class="absolute bottom-3 left-0 right-0 z-10 flex justify-center gap-1.5" data-carousel-dots></div>
        </div>

        <section class="border-b border-border bg-surface px-4 py-4 md:px-6 md:py-5" data-od-id="freshy69-detail">
          <span class="mb-2 inline-block rounded-md bg-warn/20 px-2 py-0.5 text-[11px] font-medium">ซื้อแยกได้</span>
          <h2 class="mb-2 text-xl font-semibold">ชุดเฟรชชี่ ปี 69</h2>
          <div class="mb-3 flex items-baseline justify-between gap-2">
            <span class="text-lg font-semibold text-accent">รอประกาศราคา</span>
            <span class="text-sm text-muted">เสื้อ + กางเกง</span>
          </div>
          <p class="text-sm text-muted">
            สำหรับผู้ที่ต้องการเฉพาะชุดเฟรชชี่ปี 69 สามารถเลือกไซส์เสื้อและกางเกงแยกกันได้
          </p>
        </section>

        <section class="border-b border-border bg-surface px-4 py-4" data-od-id="config-69-top">
          <div class="mb-3 flex items-center justify-between">
            <h3 class="font-semibold">เสื้อเฟรชชี่</h3>
            <span class="text-xs font-medium text-danger">จำเป็น</span>
          </div>
          <span class="mb-2 block text-sm font-medium text-muted" id="label-69-top">ไซส์เสื้อ</span>
          <div class="grid grid-cols-5 gap-2" role="group" aria-labelledby="label-69-top" data-od-id="size-69-top">
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">S</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-accent bg-accent/10 text-sm font-medium text-accent" aria-pressed="true">M</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">L</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">XL</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">2XL</button>
          </div>
        </section>

        <section class="bg-surface px-4 py-4" data-od-id="config-69-bottom">
          <div class="mb-3 flex items-center justify-between">
            <h3 class="font-semibold">กางเกงเฟรชชี่</h3>
            <span class="text-xs font-medium text-danger">จำเป็น</span>
          </div>
          <span class="mb-2 block text-sm font-medium text-muted" id="label-69-bottom">ไซส์กางเกง</span>
          <div class="grid grid-cols-5 gap-2" role="group" aria-labelledby="label-69-bottom" data-od-id="size-69-bottom">
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">S</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-accent bg-accent/10 text-sm font-medium text-accent" aria-pressed="true">M</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">L</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">XL</button>
            <button type="button" class="size-btn min-h-11 rounded-xl border border-border text-sm" aria-pressed="false">2XL</button>
          </div>
        </section>
      </div>

      <div class="fixed bottom-tabbar left-0 right-0 z-20 mx-auto w-full max-w-lg md:max-w-3xl flex items-center gap-3 border-t border-border bg-surface px-3.5 py-3" data-od-id="freshy69-sticky">
        <div class="min-w-0 flex-1">
          <div class="text-xs text-muted">ราคา</div>
          <div class="truncate text-base font-semibold text-accent">รอประกาศราคา</div>
        </div>
        <a href="cart.html" class="inline-flex min-h-12 items-center justify-center rounded-xl bg-accent px-5 text-sm font-semibold text-accent-fg hover:bg-accent-press focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" data-od-id="freshy69-add-cta">เพิ่มตะกร้า</a>
      </div>

      <nav class="fixed bottom-0 left-0 right-0 z-30 mx-auto flex h-tabbar w-full max-w-lg md:max-w-3xl border-t border-border bg-surface pb-[env(safe-area-inset-bottom,0px)]" aria-label="เมนูหลัก">
        <a class="flex flex-1 flex-col items-center justify-center gap-0.5 text-[11px] font-medium text-muted" href="home.html"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>หน้าหลัก</a>
        <a class="flex flex-1 flex-col items-center justify-center gap-0.5 text-[11px] font-medium text-muted" href="order-status.html"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 8V7a5 5 0 0 1 10 0v1M5.5 8h13l-.8 11.2A2 2 0 0 1 15.7 21H8.3a2 2 0 0 1-2-1.8L5.5 8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>คำสั่งซื้อ</a>
        <a class="flex flex-1 flex-col items-center justify-center gap-0.5 text-[11px] font-medium text-muted" href="pickup-assist.html"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="11" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>รับสินค้า</a>
        <a class="flex flex-1 flex-col items-center justify-center gap-0.5 text-[11px] font-medium text-muted" href="../index.html"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>ภาพรวม</a>
      </nav>
    </div>
  </div>
  <script>
    (function () {
      document.querySelectorAll("[data-od-id^='size-']").forEach(function (group) {
        group.addEventListener("click", function (e) {
          var btn = e.target.closest("button");
          if (!btn || !group.contains(btn)) return;
          group.querySelectorAll("button").forEach(function (b) {
            b.setAttribute("aria-pressed", "false");
            b.className = "size-btn min-h-11 rounded-xl border border-border text-sm";
          });
          btn.setAttribute("aria-pressed", "true");
          btn.className = "size-btn min-h-11 rounded-xl border border-accent bg-accent/10 text-sm font-medium text-accent";
        });
      });
    })();
  </script>
  <script src="../assets/carousel.js"></script>
</body>
</html>
